name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests scripts examples
      - run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/bench.py --split test --per-class 15 --honest-scale 0.5 --out bench_ci
      - uses: actions/upload-artifact@v4
        with:
          name: mandatebench-rules-report
          path: bench_ci/test-seed7/report.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mandate .
      - run: |
          docker run -d --name mandate -p 8000:8000 \
            -e MANDATE_AUTO_SECRETS=true -e PAYMENT_PROVIDER=fake -e LLM_ENABLED=false \
            -e EMBEDDER=hashing -e DATABASE_URL=sqlite:////tmp/mandate.db mandate
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS http://localhost:8000/health
          docker logs mandate
